services:
  postgres:
    build: .
    container_name: opsmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    # Hard cgroup limit: this is what makes an OOM reproducible. faults/oom.py
    # reads it back from `docker inspect`, so change it here only.
    mem_limit: 256m
    memswap_limit: 256m   # no swap, otherwise the kernel swaps instead of OOM-killing
    # Hard CPU cap (cgroup cpu.max). faults/cpu_spike.py reads it back from
    # `docker inspect`, so change it here only.
    cpus: '0.5'
    # Postgres's data directory lives on its own small, size-capped volume (tmpfs-backed,
    # 96 MB) so faults/disk_full.py can fill it for real without touching the host disk.
    # Survives `docker restart`; it is wiped by `compose down -v` or when the container is
    # recreated (e.g. `compose up -d` after changing this file). tmpfs pages count against
    # mem_limit above.
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Cache (Phase 1, cascading failures): the app's /health also pings this. Stopping it makes
  # the APP report unhealthy while Postgres is fine, so the symptom (app) and the cause (redis)
  # are in different containers, and a second possible cause (postgres) must be ruled out.
  redis:
    image: redis:7-alpine
    container_name: opsmind-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Second service (Phase 1): a small web app whose /health does a real round trip to Postgres.
  # Host port 5050 (not 5000: macOS uses 5000 for AirPlay). Fault: stop `postgres`, this stays up.
  app:
    build: ./app
    container_name: opsmind-app
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
    ports:
      - "${APP_HOST_PORT}:5000"
    volumes:
      - ../deploys/live:/config:ro   # the deployed config (see tools/deploy.py)
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 2
      start_period: 5s

  # ---- Standard monitoring (opt-in: `docker compose --profile monitoring up -d`) ----
  # The way a company would already watch this app. Alertmanager calls OpsMind's alert
  # receiver on the host (tools/alert_receiver.py, port 9095) with a bearer token from
  # monitoring/webhook_token (created by `python tools/alert_receiver.py --init-token`).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opsmind-prometheus
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opsmind-alertmanager
    profiles: [monitoring]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/webhook_token:/etc/alertmanager/webhook_token:ro
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop resolves it already

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=96m"
